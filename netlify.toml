[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "functions"

[[redirects]]
  from = "/api/nfe/extract-from-image"
  to = "/.netlify/functions/nfe-extract-from-image"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
